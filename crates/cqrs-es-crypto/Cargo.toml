[package]
name = "cqrs-es-crypto"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Transparent PII encryption and GDPR crypto-shredding for cqrs-es"
readme = "README.md"
keywords = ["cqrs", "event-sourcing", "gdpr", "pii", "encryption"]
categories = ["cryptography", "database"]

[features]
testing = []
derive = ["dep:cqrs-es-crypto-derive"]
chrono = ["derive", "cqrs-es-crypto-derive/chrono"]
postgres = ["dep:sqlx"]
# Google Cloud KMS-backed KekProvider (the KEK never leaves KMS). Pulls a
# rustls-only reqwest so the single-TLS-stack / distroless invariant holds.
gcp-kms = ["dep:reqwest"]
# Keyed-HMAC blind indexing: keep a crypto-shreddable (encrypted) field
# queryable via a deterministic HMAC lookup key. Pure-Rust deps; zero cost when
# unused. Combine with `postgres` for the write-path `BlindIndexHook`, and with
# `gcp-kms` for the KMS-macSign-backed key provider.
blind-index = ["dep:hmac", "dep:sha2", "dep:unicode-normalization"]

[dependencies]
cqrs-es-crypto-derive = { version = "0.3.0", path = "../cqrs-es-crypto-derive", optional = true }
aes-gcm = "0.10"
aes-kw = "0.3"
async-trait = "0.1.92"
base64 = "0.22"
cqrs-es = "0.5"
hmac = { version = "0.12", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
], optional = true }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
unicode-normalization = { version = "0.1", optional = true }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[[test]]
name = "postgres_key_store"
required-features = ["postgres"]

[[test]]
name = "postgres_repository"
required-features = ["postgres", "testing"]

[[test]]
name = "postgres_blind_index"
required-features = ["blind-index", "postgres", "testing"]

[dev-dependencies]
async-trait = "0.1.92"
base64 = "0.22"
cqrs-es = "0.5"
wiremock = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
